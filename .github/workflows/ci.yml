name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test ./internal/kana -run '^$' -fuzz FuzzDecode -fuzztime 30s
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run types && git diff --exit-code -- src/api.generated.ts
        working-directory: web
      - run: pnpm run format:check && pnpm run build && pnpm run test
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: |
          go build -o /tmp/kanji-api ./cmd/api
          /tmp/kanji-api > /tmp/kanji-api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1; done
          cd web
          pnpm run e2e
