services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      BASE_URL: http://localhost:8080
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local-kanji
      AWS_SECRET_ACCESS_KEY: local-development-only
      S3_BUCKET: kanji-glyphs
      S3_ENDPOINT: http://minio:9000
    depends_on:
      minio-init:
        condition: service_completed_successfully
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-kanji
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 local-kanji local-development-only; do sleep 1; done
        mc mb --ignore-existing local/kanji-glyphs
volumes:
  minio-data:
